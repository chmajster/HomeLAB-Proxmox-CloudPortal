name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  php:
    runs-on:
      - self-hosted
      - linux
      - x64
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cloud_portal_test
          MARIADB_USER: portal
          MARIADB_PASSWORD: portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=cloud_portal_test;charset=utf8mb4
      TEST_DB_USER: portal
      TEST_DB_PASSWORD: portal
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring, pdo_mysql, sodium
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer audit
      - run: composer lint
      - run: composer test
      - run: composer test:smoke

  e2e:
    runs-on:
      - self-hosted
      - linux
      - x64
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring, pdo_mysql, sodium
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: php -S 127.0.0.1:8765 tests/http-router.php > /tmp/cloudportal-http.log 2>&1 &
      - run: npx playwright test
      - if: failure()
        run: cat /tmp/cloudportal-http.log
